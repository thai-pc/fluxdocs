name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # The default build MUST be pure-Go: core stays MIT and never pulls in
      # CGO by accident. CGO is enabled only behind a build tag (ocr, mupdf).
      - name: Build (pure-Go, CGO disabled)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # The race detector needs CGO (C runtime); the code stays pure-Go, CGO is
      # on only for the race runtime and nothing imports C.
      - name: Test (race)
        run: go test -race ./...

      # SECURITY GATE: hostile documents must stop at the per-page render budget
      # (SECURITY.md §2). CPU-time gates (plus deadline checks), so they run
      # without -race.
      - name: Render budget DoS gate
        run: go test ./testing/security/dos/...

      # SECURITY GATE: redacted content must not be extractable afterwards
      # (spec §13.4, .claude/SECURITY.md §1). Must pass 100% once tests exist.
      - name: Redaction security gate
        run: |
          if ls testing/security/redaction/*_test.go >/dev/null 2>&1; then
            go test ./testing/security/redaction/...
          else
            echo "No redaction tests yet — gate is a placeholder."
          fi

  cloud:
    name: Build & Test (cloud module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build (pure-Go)
        env:
          CGO_ENABLED: "0"
        run: go build ./...
      # go test exits 1 when a module has no packages, so only run it once the
      # cloud module contains real Go packages.
      - name: Test (race)
        run: |
          if [ -n "$(go list ./... 2>/dev/null)" ]; then
            go test -race ./...
          else
            echo "Cloud module has no Go packages yet — skipping tests."
          fi

  wasm:
    name: Build WASM (client-side core)
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # The product's core differentiator: the same Go core compiled to WASM
      # and run client-side. This build must always stay green.
      - name: Build core + wasm entry for js/wasm
        run: go build ./core/... ./wasm/...

  web:
    name: JS wrappers & demos (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # React/Vue resolve @fluxdocs/core through its dist/ (gitignored), so the
      # packages are built first, in dependency order.
      - name: Build packages
        run: pnpm -r --filter "./packages/*" build
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test
